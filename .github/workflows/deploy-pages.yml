name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Mintlify CLI
        run: npm install -g mintlify

      - name: Generate OpenAPI spec
        run: npm run generate-mintlify-openapi-file

      - name: Export static docs
        run: |
          # 自动获取仓库名称作为 base-path（例如 /documentation）
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "Building for base path: /${REPO_NAME}"
          mintlify export --output export.zip --base-path "/${REPO_NAME}"
          unzip -q export.zip -d ./public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
